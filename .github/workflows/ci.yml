name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build release workspace
        run: cargo build --workspace --release --locked
      - name: Compile benchmarks
        run: cargo bench -p proxy-server --no-run --locked
      - name: Validate Compose configuration
        run: docker compose --file docker/compose.yaml config --quiet
      - name: Build container image
        run: docker build --file docker/Dockerfile --tag identity-proxy:ci .
      - name: Verify container runs as non-root
        run: test "$(docker image inspect identity-proxy:ci --format '{{.Config.User}}')" = "10001:10001"

  tests:
    name: Test (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.89.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Exercise mTLS proxy end to end
        if: matrix.rust == 'stable'
        run: scripts/e2e-test.sh

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit locked dependencies
        run: cargo audit

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Run tests and enforce line coverage
        run: cargo llvm-cov --workspace --locked --ignore-filename-regex 'crates/proxy-server/src/main\.rs' --fail-under-lines 65 --lcov --output-path lcov.info
      - name: Upload LCOV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: lcov.info
          if-no-files-found: ignore
          retention-days: 14
