[package]
name = "proxy-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "identity-proxy"
path = "src/main.rs"

[dependencies]
proxy-core = { workspace = true }
proxy-tls = { workspace = true }
proxy-policy = { workspace = true }
proxy-trust = { workspace = true }
tokio = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
pin-project-lite = { workspace = true }
clap = { workspace = true }
arc-swap = { workspace = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "webpki-roots", "ring", "tls12", "native-tokio"] }

[dev-dependencies]
rcgen = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "proxy_bench"
harness = false
