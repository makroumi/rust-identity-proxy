[server]
listen_addr = "0.0.0.0:8443"
health_addr = "127.0.0.1:9090"
upstream_url = "https://backend:443"

[tls]
server_cert = "/etc/identity-proxy/config/certs/server.crt"
server_key = "/etc/identity-proxy/config/certs/server.key"

[policy]
policy_file = "/etc/identity-proxy/config/policies.yaml"

[limits]
max_body_bytes = 10485760
request_timeout_secs = 30
max_concurrency = 1000
rate_limit_rps = 5000
rate_limit_burst = 10000
max_connections = 4096

[trust]
ca_bundle_path = "/etc/identity-proxy/config/certs/ca.crt"
