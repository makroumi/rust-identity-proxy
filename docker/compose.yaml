services:
  proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: ["--config", "/etc/identity-proxy/compose-proxy.toml"]
    ports:
      - "8443:8443"
    volumes:
      - ../config:/etc/identity-proxy/config:ro
      - ./compose-proxy.toml:/etc/identity-proxy/compose-proxy.toml:ro
    depends_on:
      - backend
    read_only: true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - identity-proxy
        - --config
        - /etc/identity-proxy/compose-proxy.toml
        - --healthcheck
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  backend:
    image: kennethreitz/httpbin
    expose:
      - "80"
